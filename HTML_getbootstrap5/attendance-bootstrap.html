<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thinkthank - Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100 bg-body">

  <!-- Header -->
  <header class="sticky-top bg-body border-bottom">
    <div class="container d-flex align-items-center justify-content-between py-2" style="max-width: 430px;">
      <div class="d-flex align-items-center gap-2">
        <img alt="Thinktank Logo" class="img-fluid" height="32" style="height: 32px; width: auto;"
          src="https://8thinktank.com/wp-content/uploads/2024/05/think-tank-solusindo.png">
        
      </div>

      <button type="button" class="btn btn-light rounded-circle p-1 position-relative" aria-label="Profile">
        <img alt="Profile" class="rounded-circle object-fit-cover" width="36" height="36"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuBq566SH8nUEbo6TRZ2dMta7HT8UNDoFDuX2eqcwaa4L7uC43pxCsq-E-7_vxmSgxj4QoLtCjcGAQeuZvo5hAyzzN8j03GwA-fNwxbiLN0jt8w3zUDMW44xppnZs4MP-PXXGp6xVqjyuz61_jVEvVJz0-C2Uo8QbxKGFoulaVr1GyjVa6ITDz42VmQY8jbXEyxEGygrEQRtyFD0aUHgmYShZMgy_ItQUPk1rlyt4Hg">
        <span
          class="position-absolute bottom-0 end-0 p-1 bg-success border border-2 border-white rounded-circle"></span>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-grow-1">
    <div class="container py-3" style="max-width: 430px;">

      <!-- Status badges -->
      <div class="d-flex align-items-center justify-content-between mb-3">
        <span class="badge rounded-pill text-bg-light border d-inline-flex align-items-center gap-2 text-uppercase"
          id="shift-status-pill-wrap">
          <span class="spinner-grow spinner-grow-sm text-success" style="width: .5rem; height: .5rem;"
            aria-hidden="true"></span>
          <span class="text-success" id="shift-status-pill">Ready to Check In</span>
        </span>
        <span class="badge rounded-pill text-bg-light border fw-medium">
          <i class="bi bi-patch-check-fill text-success me-1"></i>GPS Verified
        </span>
      </div>

      <!-- Clock & location -->
      <div class="card bg-body-tertiary  text-center mb-3">
        <div class="card-body">
          <small class="text-secondary text-uppercase fw-semibold" id="live-date">Wednesday, Oct 24, 2024</small>
          <div class="d-flex align-items-baseline justify-content-center gap-2 my-1">
            <span class="display-3 fw-bold" id="live-clock">08:58</span>
            <span class="fs-5 fw-semibold text-secondary" id="live-ampm">AM</span>
          </div>
          <div class="d-inline-flex align-items-center gap-2 bg-body rounded-pill shadow-sm px-3 py-2 mw-100">
            <i class="bi bi-geo-alt-fill text-success"></i>
            <small class="fw-medium text-truncate">HQ - 4th Floor Tech Hub</small>
            <span class="badge rounded-pill text-bg-success">In Area</span>
          </div>
        </div>
      </div>

      <!-- Action button -->
      <div class="d-grid mb-3">
        <button type="button"
          class="btn btn-primary btn-lg py-3 fw-semibold d-flex align-items-center justify-content-center gap-2"
          id="clock-action-btn">
          <i class="bi bi-fingerprint fs-4"></i>
          <span id="action-btn-text">Tap to Check In</span>
        </button>
      </div>
      

      <!-- Shift schedule -->
      <div class="card bg-body-tertiary mb-3">
        <div class="card-body d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-3">
            <div class="d-flex align-items-center justify-content-center rounded-3 bg-primary-subtle text-primary p-2">
              <i class="bi bi-calendar-event fs-5"></i>
            </div>
            <div class="lh-sm">
              <small class="text-secondary text-uppercase fw-semibold d-block">Today's Shift</small>
              <span class="fw-semibold">09:00 AM – 05:30 PM</span>
            </div>
          </div>
          <span class="badge rounded-pill text-bg-light text-primary shadow-sm">8.5h Total</span>
        </div>
      </div>

      <!-- Metrics -->
      <div class="row row-cols-3 g-2 mb-3 text-center">
        <div class="col">
          <div class="card bg-body-tertiary  h-100">
            <div class="card-body p-2">
              <small class="text-secondary text-uppercase fw-semibold d-block">First In</small>
              <div class="fw-semibold" id="metric-first-in">--:--</div>
              <small class="text-secondary">Morning</small>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card bg-body-tertiary  h-100">
            <div class="card-body p-2">
              <small class="text-secondary text-uppercase fw-semibold d-block">Total Time</small>
              <div class="fw-semibold" id="metric-total-hours">0h 00m</div>
              <small class="text-success fw-medium">Active</small>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card bg-body-tertiary  h-100">
            <div class="card-body p-2">
              <small class="text-secondary text-uppercase fw-semibold d-block">Target</small>
              <div class="fw-semibold">8.0h</div>
              <small class="text-secondary">Standard</small>
            </div>
          </div>
        </div>
      </div>

      
      
    </div>
  </main>

  <!-- Bottom nav -->
  <nav class="sticky-bottom bg-body border-top">
    <div class="container d-flex justify-content-around py-2" style="max-width: 430px;">
      <a href="#" aria-current="page"
        class="d-flex flex-column align-items-center text-decoration-none text-primary fw-semibold flex-fill">
        <span class="rounded-pill bg-primary-subtle px-3 py-1"><i class="bi bi-clock fs-5"></i></span>
        <small>Attendance</small>
      </a>
      <a href="#" class="d-flex flex-column align-items-center text-decoration-none text-secondary flex-fill">
        <span class="px-3 py-1"><i class="bi bi-calendar-range fs-5"></i></span>
        <small>History</small>
      </a>
      <a href="#" class="d-flex flex-column align-items-center text-decoration-none text-secondary flex-fill">
        <span class="px-3 py-1"><i class="bi bi-person fs-5"></i></span>
        <small>Profile</small>
      </a>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      let isCheckedIn = false;
      let shiftSeconds = 0;
      let timerInterval = null;

      const actionBtn = document.getElementById('clock-action-btn');
      const actionText = document.getElementById('action-btn-text');
      const statusPill = document.getElementById('shift-status-pill');
      const metricFirstIn = document.getElementById('metric-first-in');
      const metricTotalHours = document.getElementById('metric-total-hours');
      const clockEl = document.getElementById('live-clock');
      const ampmEl = document.getElementById('live-ampm');
      const dateEl = document.getElementById('live-date');

      function updateLiveClock() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;

        clockEl.textContent = String(hours).padStart(2, '0') + ':' + minutes;
        ampmEl.textContent = ampm;
        dateEl.textContent = now.toLocaleDateString('en-US', {
          weekday: 'long', month: 'short', day: 'numeric', year: 'numeric'
        });
      }

      setInterval(updateLiveClock, 1000);
      updateLiveClock();

      function formatDuration(sec) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        return h + 'h ' + String(m).padStart(2, '0') + 'm';
      }

      actionBtn.addEventListener('click', function () {
        isCheckedIn = !isCheckedIn;

        if (isCheckedIn) {
          actionBtn.classList.replace('btn-primary', 'btn-danger');
          actionText.textContent = 'Tap to Check Out';

          statusPill.textContent = 'Active On Shift';
          statusPill.classList.replace('text-success', 'text-primary');

          const now = new Date();
          let h = now.getHours();
          const m = String(now.getMinutes()).padStart(2, '0');
          const ap = h >= 12 ? 'PM' : 'AM';
          h = h % 12 || 12;
          metricFirstIn.textContent = String(h).padStart(2, '0') + ':' + m + ' ' + ap;

          shiftSeconds = 0;
          metricTotalHours.textContent = '0h 01m';
          clearInterval(timerInterval);
          timerInterval = setInterval(function () {
            shiftSeconds += 60;
            metricTotalHours.textContent = formatDuration(shiftSeconds);
          }, 60000);
        } else {
          actionBtn.classList.replace('btn-danger', 'btn-primary');
          actionText.textContent = 'Tap to Check In';

          statusPill.textContent = 'Ready to Check In';
          statusPill.classList.replace('text-primary', 'text-success');

          clearInterval(timerInterval);
        }
      });
    })();
  </script>
</body>

</html>
