<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thinktank - Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">

  <main class="container my-auto py-4" style="max-width: 430px;">

    <!-- Header -->
    <div class="text-center mb-4">
     <img alt="Thinktank Logo" class="img-fluid"  width="90%" height="auto"
          src="https://8thinktank.com/wp-content/uploads/2024/05/think-tank-solusindo.png">

     

      <h1 class="h2 fw-bold mt-3 mb-1">Thinktank Login</h1>
      <p class="text-secondary mb-0">Sign in to record your attendance</p>
    </div>

    <!-- Form card -->
    <div class="card border-0 shadow-sm rounded-4">
      <form class="card-body p-4" id="login-form" novalidate>

        <div class="mb-3">
          <label for="identifier" class="form-label fw-semibold">Email or Employee ID</label>
          <div class="input-group input-group-lg">
            <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
            <input type="text" class="form-control" id="identifier" autocomplete="username"
                   placeholder="name@company.com or employee ID">
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <div class="input-group input-group-lg">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" autocomplete="current-password"
                   placeholder="Enter your security passcode">
            <button class="btn btn-outline-secondary" type="button" id="toggle-pwd" aria-label="Toggle password visibility">
              <i class="bi bi-eye" id="pwd-icon"></i>
            </button>
          </div>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="remember-me" checked>
          <label class="form-check-label text-secondary" for="remember-me">Keep me signed in</label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 d-flex align-items-center justify-content-center gap-2" id="submit-btn">
          <span>Sign In</span>
          <i class="bi bi-arrow-right"></i>
        </button>

        <p class="text-center text-secondary small mt-3 mb-0">
          Forgot password?
          <a href="#admin-support" class="fw-semibold text-decoration-none">Contact your administrator</a>
        </p>
      </form>
    </div>

    <!-- Footer -->
    <div class="text-center mt-4">
      <span class="badge rounded-pill text-bg-light border text-secondary fw-normal py-2 px-3">
        <i class="bi bi-shield-check text-success me-1"></i>Protected by  SSL security
      </span>
      <p class="small text-body-tertiary mt-2 mb-0">Build version 1.0.0</p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
